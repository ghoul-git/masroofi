# Run everything locally: docker compose up --build
# Reads .env. DB_NAME, DB_USER and DB_PASSWORD also create the PostgreSQL database.

x-app: &app
  build: .
  image: masroofi
  env_file: .env
  environment:
    # Inside Compose the database is the "db" service, whatever .env says for local development.
    DATABASE_URL: ""
    DB_HOST: db
    DB_PORT: "5432"
  restart: unless-stopped

services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  web:
    <<: *app
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz')"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  worker:
    <<: *app
    command: python manage.py process_receipts
    depends_on:
      # The web service runs the migrations before it reports healthy.
      web:
        condition: service_healthy

volumes:
  postgres-data:
