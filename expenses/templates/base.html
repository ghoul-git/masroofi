<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Masroofi{% endblock %}</title>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
            background: #f5f6f8;
            color: #1f2933;
        }
        .navbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0.75rem 1.5rem;
            background: #ffffff;
            border-bottom: 1px solid #e3e6ea;
        }
        .navbar .brand {
            font-weight: 700;
            font-size: 1.2rem;
            color: #0f766e;
            text-decoration: none;
        }
        .navbar .links {
            display: flex;
            align-items: center;
            gap: 1rem;
        }
        .navbar a {
            color: #1f2933;
            text-decoration: none;
        }
        .navbar a:hover { color: #0f766e; }
        .navbar form { margin: 0; }
        .link-button {
            background: none;
            border: none;
            padding: 0;
            font: inherit;
            color: #1f2933;
            cursor: pointer;
        }
        .link-button:hover { color: #0f766e; }
        main {
            max-width: 960px;
            margin: 2rem auto;
            padding: 0 1rem;
        }
        .card {
            background: #ffffff;
            border: 1px solid #e3e6ea;
            border-radius: 8px;
            padding: 1.5rem;
        }
        .form-card { max-width: 400px; margin: 0 auto; }
        label { display: block; margin-bottom: 0.25rem; font-weight: 600; }
        input[type="text"], input[type="email"], input[type="password"] {
            width: 100%;
            padding: 0.5rem;
            margin-bottom: 1rem;
            border: 1px solid #cbd2d9;
            border-radius: 4px;
            font: inherit;
        }
        .button {
            display: inline-block;
            padding: 0.5rem 1rem;
            background: #0f766e;
            color: #ffffff;
            border: none;
            border-radius: 4px;
            font: inherit;
            cursor: pointer;
        }
        .button:hover { background: #115e59; }
        .errors {
            color: #b91c1c;
            padding-left: 1.25rem;
        }
    </style>
</head>
<body>
    <nav class="navbar">
        <a class="brand" href="{% url 'home' %}">Masroofi</a>
        <div class="links">
            {% if user.is_authenticated %}
                <a href="{% url 'home' %}">Home</a>
                <form method="post" action="{% url 'logout' %}">
                    {% csrf_token %}
                    <button type="submit" class="link-button">Log out</button>
                </form>
            {% else %}
                <a href="{% url 'login' %}">Log in</a>
                <a href="{% url 'register' %}">Register</a>
            {% endif %}
        </div>
    </nav>

    <main>
        {% block content %}{% endblock %}
    </main>
</body>
</html>
