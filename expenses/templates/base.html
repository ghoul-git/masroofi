<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Masroofi{% endblock %}</title>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
            background: #f5f6f8;
            color: #1f2933;
        }
        .navbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0.75rem 1.5rem;
            background: #ffffff;
            border-bottom: 1px solid #e3e6ea;
        }
        .navbar .brand {
            font-weight: 700;
            font-size: 1.2rem;
            color: #0f766e;
            text-decoration: none;
        }
        .navbar .links {
            display: flex;
            align-items: center;
            gap: 1rem;
        }
        .navbar a {
            color: #1f2933;
            text-decoration: none;
        }
        .navbar a:hover { color: #0f766e; }
        .navbar form { margin: 0; }
        .link-button {
            background: none;
            border: none;
            padding: 0;
            font: inherit;
            color: #1f2933;
            cursor: pointer;
        }
        .link-button:hover { color: #0f766e; }
        main {
            max-width: 960px;
            margin: 2rem auto;
            padding: 0 1rem;
        }
        .card {
            background: #ffffff;
            border: 1px solid #e3e6ea;
            border-radius: 8px;
            padding: 1.5rem;
        }
        .form-card { max-width: 400px; margin: 0 auto; }
        label { display: block; margin-bottom: 0.25rem; font-weight: 600; }
        input[type="text"], input[type="email"], input[type="password"] {
            width: 100%;
            padding: 0.5rem;
            margin-bottom: 1rem;
            border: 1px solid #cbd2d9;
            border-radius: 4px;
            font: inherit;
        }
        .button {
            display: inline-block;
            padding: 0.5rem 1rem;
            background: #0f766e;
            color: #ffffff;
            border: none;
            border-radius: 4px;
            font: inherit;
            cursor: pointer;
        }
        .button:hover { background: #115e59; }
        .errors {
            color: #b91c1c;
            padding-left: 1.25rem;
        }
        input[type="date"], input[type="number"], input[type="file"], select {
            width: 100%;
            padding: 0.5rem;
            margin-bottom: 1rem;
            border: 1px solid #cbd2d9;
            border-radius: 4px;
            font: inherit;
            background: #ffffff;
        }
        table input[type="text"], table input[type="date"], table input[type="number"], table select {
            margin-bottom: 0;
            padding: 0.35rem;
        }
        .button[disabled] { opacity: 0.6; cursor: wait; }
        .button-secondary { background: #e4e7eb; color: #1f2933; }
        .button-secondary:hover { background: #cbd2d9; }
        .button-danger { background: #b91c1c; }
        .button-danger:hover { background: #991b1b; }
        .button-small { padding: 0.3rem 0.6rem; font-size: 0.9rem; }
        .actions { display: flex; gap: 0.5rem; flex-wrap: wrap; }
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 0 1rem;
        }
        .table-wrap { overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; }
        th, td {
            text-align: left;
            padding: 0.5rem;
            border-bottom: 1px solid #e3e6ea;
            vertical-align: middle;
        }
        th { font-size: 0.85rem; color: #52606d; text-transform: uppercase; }
        td.number, th.number { text-align: right; }
        .muted { color: #52606d; }
        .notice {
            padding: 0.75rem 1rem;
            border-radius: 4px;
            margin-bottom: 1rem;
            background: #fef3c7;
            color: #78350f;
        }
        .notice.success { background: #d1fae5; color: #065f46; }
        .spinner {
            display: inline-block;
            width: 1rem;
            height: 1rem;
            border: 2px solid #cbd2d9;
            border-top-color: #0f766e;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            vertical-align: middle;
            margin-right: 0.5rem;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        [hidden] { display: none !important; }
    </style>
</head>
<body>
    <nav class="navbar">
        <a class="brand" href="{% url 'home' %}">Masroofi</a>
        <div class="links">
            {% if user.is_authenticated %}
                <a href="{% url 'home' %}">Home</a>
                <a href="{% url 'upload' %}">Upload</a>
                <a href="{% url 'expenses' %}">Expenses</a>
                <a href="{% url 'chat' %}">Ask Masroofi</a>
                <form method="post" action="{% url 'logout' %}">
                    {% csrf_token %}
                    <button type="submit" class="link-button">Log out</button>
                </form>
            {% else %}
                <a href="{% url 'login' %}">Log in</a>
                <a href="{% url 'register' %}">Register</a>
            {% endif %}
        </div>
    </nav>

    <main>
        {% block content %}{% endblock %}
    </main>

    {% block scripts %}{% endblock %}
</body>
</html>
